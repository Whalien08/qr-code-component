<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frontend Mentor | QR code component</title>

  <style>
    body {
      background-color: hsl(212, 45%, 89%);
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
    }

    .card {
      background-color: white;
      width: 280px;
      margin: 0 auto; 
      margin-top: 80px; 
      padding: 15px;
      border-radius: 15px;
      box-shadow: 0px 5px 10px rgba(0, 0, 0, 0.1);
    }

    .qr-image {
      width: 100%;
      border-radius: 10px;
      height:300px;
    }

    h1 {
      color: hsl(218, 44%, 22%);
      font-size: 1.4rem;
      margin-top: 20px;
    }

    p{
      color: hsl(220, 15%, 55%);
      font-size: 1rem;
      padding-bottom: 15px;
    }

    .attribution {
      margin-top: 50px;
      font-size: 12px;
      color: hsl(228, 45%, 44%);
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="./images/image-qr-code.png" alt="QR code linking to Frontend Mentor" class="qr-image">
    
    <div class="text-box">
      <h1>Improve your front-end skills by building projects</h1>
      <p >Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
    </div>
  </div>

  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Mithra Xavier</a>.
  </div>

</body>
</html>
